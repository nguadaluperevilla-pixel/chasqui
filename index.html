<title>Chasqui Taxi</title>

<style>
:root{--bosque:#1F3B2D;--tinta:#EEEADD;--suave:#AFC2B6;--oro:#E3C27E;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bosque);color:var(--tinta);font-family:'Atkinson Hyperlegible','Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{width:100%;max-width:420px;text-align:center}
img{width:min(200px,55vw);height:auto}
h1{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:800;font-size:40px;letter-spacing:.08em;text-transform:uppercase;margin:10px 0 2px}
.prueba{display:inline-block;background:var(--oro);color:#1B2620;font-weight:700;font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:3px 8px}
p{color:var(--suave)}
a{display:block;text-decoration:none;color:#0F1511;background:#7DB896;border-radius:16px;padding:16px;margin:10px 0;font-weight:700;font-size:19px}
a.sec{background:rgba(238,234,221,.1);color:var(--tinta)}
</style>
</head>
<body>
<main>
  <img src="app/icon-512.png" alt="">
  <h1>Chasqui Taxi</h1>
  <span class="prueba">Versión de prueba</span>
